# Publishes the package to npm when a version tag is pushed.
#
# No token and no second factor: npm trusts this workflow by name, and the
# proof is an OIDC token GitHub mints for the run. That trust has to be set up
# once, on the package's settings page at npmjs.com, naming this file.
#
# Every tool the build shells out to comes from the flake, pinned by
# flake.lock, so this runs the same compiler and the same wasm-opt as a
# developer does. Two releases failed before that was true.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # What lets the runner prove to npm that it is this workflow.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a commit: a tag can be moved, and these run
      # with a token that can publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - run: nix develop --command cargo test

      - run: nix develop --command cargo clippy --all-targets --target wasm32-unknown-unknown

      - run: nix develop --command ./build-package.sh

      - name: Check the tag matches the version being published
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          # Read directly rather than through the shell: nothing about this
          # needs the toolchain, and a shell is a thing that can print.
          packaged=$(jq -r .version pkg/package.json)

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $packaged" >&2
            exit 1
          fi

      # Deliberately no actions/setup-node. Given `registry-url` it writes an
      # .npmrc saying `_authToken=${NODE_AUTH_TOKEN}`, and with no such token —
      # which is the whole point of trusted publishing — that expands to
      # nothing. npm reads it, concludes it is already authenticated, never
      # asks GitHub for an OIDC token, and the registry answers 404.
      # See actions/setup-node#1551 and npm/cli#9088.
      #
      # The flake's npm is 11.17, past the 11.5.1 trusted publishing needs, so
      # there is nothing setup-node was here to provide.
      - name: Publish
        run: |
          if [ -e ~/.npmrc ] && grep -q _authToken ~/.npmrc; then
            echo "an _authToken in ~/.npmrc would suppress the OIDC exchange" >&2
            exit 1
          fi

          # Whether GitHub handed this job the means to mint an OIDC token.
          # Never the token itself, only that it is there.
          echo "OIDC endpoint offered: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC request token:   ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
          echo "repository:           $GITHUB_REPOSITORY"
          echo "workflow file:        ${GITHUB_WORKFLOW_REF##*/}"
          echo "npm $(nix develop --command npm --version)"

          nix develop --command npm publish ./pkg
