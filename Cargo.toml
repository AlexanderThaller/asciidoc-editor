[package]
name = "asciidoc-editor"
version = "0.1.2"
edition = "2024"
description = "A WYSIWYG AsciiDoc editor for the web, in Rust and WebAssembly"
license = "MIT"
repository = "https://github.com/AlexanderThaller/asciidoc-editor"
keywords = ["asciidoc", "editor", "wysiwyg", "wasm"]
categories = ["wasm", "text-editors", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
asciidoc-html5 = "0.2.2"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
regex = "1.13.1"
# Pinned exactly: the generator that turns the wasm into a loadable module
# must be the same version, and it comes from nixpkgs (see flake.nix).
wasm-bindgen = "=0.2.127"
web-sys = { version = "0.3", features = ["HtmlIFrameElement", "HtmlTextAreaElement", "HtmlAnchorElement", "HtmlInputElement", "Document", "Element", "HtmlElement", "Window", "Storage", "Blob", "BlobPropertyBag", "Url", "File", "FileList", "FileReader", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "DomTokenList", "CssStyleDeclaration", "Event", "MouseEvent", "EventTarget", "NodeList", "console", "Range", "DocumentFragment", "Selection", "KeyboardEvent", "DomStringMap", "HtmlDocument", "DomRect", "ClipboardEvent", "DataTransfer", "DragEvent"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
